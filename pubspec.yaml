name: jivosdk_plugin
description: Flutter plugin that bridges to JivoSDK
version: 1.0.2
homepage: https://www.jivosite.com/

environment:
  sdk: '>=3.2.5 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.jivosite.jivosdk_plugin
        pluginClass: JivoPlugin
      ios:
        pluginClass: JivoPlugin
